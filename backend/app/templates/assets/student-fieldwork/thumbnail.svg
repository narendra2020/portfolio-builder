<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Fieldwork thumbnail</title>
  <desc id="desc">Forest-green academic layout with a wide research banner and timeline.</desc>
  <rect width="640" height="400" rx="28" fill="#f4f6f1"/>
  <rect x="0" y="0" width="640" height="8" fill="#27654a"/>
  <text x="40" y="58" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#1d362c">fieldwork.</text>
  <rect x="510" y="40" width="90" height="26" fill="none" stroke="#cdd9cf"/>
  <text x="40" y="110" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="3" fill="#27654a">ENVIRONMENTAL SCIENCE</text>
  <text x="40" y="160" font-family="Georgia, serif" font-size="46" letter-spacing="-2" fill="#1d362c">Learning today.</text>
  <text x="40" y="210" font-family="Georgia, serif" font-size="46" letter-spacing="-2" fill="#1d362c">Changing tomorrow.</text>
  <rect x="40" y="236" width="560" height="64" fill="#dce7d8"/>
  <rect x="40" y="236" width="6" height="64" fill="#27654a"/>
  <text x="66" y="280" font-family="Georgia, serif" font-size="30" fill="#1d362c">Field notes</text>
  <text x="340" y="274" font-family="Arial, sans-serif" font-size="13" fill="#64786d">Research with purpose.</text>
  <rect x="40" y="318" width="170" height="60" fill="#cbdcb6"/>
  <rect x="235" y="318" width="170" height="60" fill="#bcd6ce"/>
  <rect x="430" y="318" width="170" height="60" fill="#e1d6b6"/>
</svg>