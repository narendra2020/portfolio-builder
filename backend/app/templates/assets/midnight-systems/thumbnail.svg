  <desc id="desc">Dark dashboard grid with electric blue and lime system signals.</desc>
  <defs>
    <linearGradient id="dash" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#070910" />
      <stop offset="1" stop-color="#111a2a" />
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#dash)" rx="28" />
  <rect x="40" y="48" width="560" height="56" rx="16" fill="#0f1726" stroke="#27324a" stroke-width="1.5" />
  <text x="64" y="86" font-family="'Space Grotesk', sans-serif" font-size="22" fill="#6de9c1">System Status</text>
  <circle cx="540" cy="76" r="9" fill="#2f6bff" />
  <circle cx="564" cy="76" r="9" fill="#57f7c9" />
  <rect x="40" y="124" width="260" height="220" rx="20" fill="#111d31" stroke="#27324a" stroke-width="1.5" />
